name: Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Rust tests
        run: cargo test

  build:
    name: Build binaries
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      # ferric builds the React Native artifacts: an XCFramework for the Apple
      # targets and an Android libs directory, which needs the SDK and NDK.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.1.12297006"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1, x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios-sim, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc, aarch64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      # The Microsoft CRT/SDK headers cargo-xwin downloads for the windows-msvc
      # targets are ~1GB and are not covered by rust-cache.
      - name: Cache xwin CRT/SDK
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cargo-xwin
          key: ${{ runner.os }}-cargo-xwin

      - name: Install pre-built Rust tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild, cargo-xwin, wasm-opt

      # rs-x11-hash compiles its C sources for wasm with plain `clang`, and
      # Apple's clang has no wasm backend.
      - name: Install LLVM for WebAssembly (macOS)
        run: |
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install project dependencies
        run: npm install

      - name: Build JS bundle
        run: npm run build:full
        env:
          # musl defaults to a static CRT, which produces a staticlib instead of
          # the shared object the Node-API loader needs.
          RUSTFLAGS: '-C target-feature=-crt-static'
          # Accepts Microsoft's license for the CRT/SDK headers cargo-xwin downloads.
          XWIN_ACCEPT_LICENSE: '1'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-dist
          retention-days: 1
          path: ./dist

  test:
    name: Test ${{ matrix.settings.target }} (Node ${{ matrix.node-version }})
    needs: build
    runs-on: ${{ matrix.settings.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        settings:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install project dependencies
        run: npm install

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-dist
          path: ./dist

      - name: Run tests
        run: npm test
